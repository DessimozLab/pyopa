[build-system]
requires = [
    # setuptools and Cython are needed for the setup.py based build of the extension
    "setuptools>=77.0",
    "Cython>=3.0",
    # building against numpy 2.x yields wheels compatible with numpy 1.x and 2.x
    "numpy>=2.0",
]
build-backend = "setuptools.build_meta"

[project]
name = "pyopa"
dynamic = ["version"]
description = "PyOPA - optimal pairwise sequence alignments"
readme = "README.rst"
license = "MPL-2.0"
license-files = ["LICENSE"]
authors = [{ name = "OMA Browser", email = "contact@omabrowser.org" }]
requires-python = ">=3.10"
dependencies = ["numpy"]
keywords = ["sequence alignments", "Smith-Waterman", "Needleman-Wunsch", "dynamic programming", "bioinformatics"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
]

[project.urls]
Homepage = "https://omabrowser.org/"
Source = "https://github.com/DessimozLab/pyopa"

[dependency-groups]
test = ["pytest"]
lint = ["flake8"]
dev = [{ include-group = "test" }, { include-group = "lint" }]

[tool.setuptools.dynamic]
version = { attr = "pyopa.__version__" }

[tool.setuptools.packages.find]
include = ["pyopa*"]

[tool.cibuildwheel]
build-frontend = "build[uv]"
build-verbosity = 1
# the Cython extension is not declared free-threading compatible yet;
# no 32-bit windows wheels; numpy has no windows arm64 wheels for Python 3.10
skip = ["cp3*t-*", "*-win32", "cp310-win_arm64"]
test-groups = ["test"]
test-command = "pytest -v {project}/test"
# fail instead of silently building wheels without parallel support
environment = { PYOPA_REQUIRE_OPENMP = "1" }

[tool.cibuildwheel.macos]
# libomp built for the wheel's MACOSX_DEPLOYMENT_TARGET, bundled by delocate
before-all = "bash tools/build_libomp_macos.sh /tmp/libomp"
# set explicitly: before-all otherwise gets MACOSX_DEPLOYMENT_TARGET=10.9 from
# cibuildwheel, but libomp needs >= 10.15 (and arm64 needs >= 11.0 anyway)
environment = { PYOPA_REQUIRE_OPENMP = "1", OPENMP_PREFIX = "/tmp/libomp", MACOSX_DEPLOYMENT_TARGET = "11.0" }

[tool.cibuildwheel.windows]
# bundle the MSVC OpenMP runtime (vcomp140.dll)
repair-wheel-command = "uvx delvewheel repair -w {dest_dir} {wheel}"
