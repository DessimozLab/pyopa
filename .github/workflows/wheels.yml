name: Build and upload to PyPI

# Build on every branch push, tag push, and pull request change:
on: [push, pull_request]
# Alternatively, to publish when a (published) GitHub Release is created, use the following:
# on:
#   push:
#   pull_request:
#   release:
#     types:
#       - published

permissions:
  contents: read

jobs:
  build_wheels:
    name: Build wheels on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # native runners for each architecture, so tests run on every wheel
        os:
          - ubuntu-latest       # linux x86_64
          - ubuntu-24.04-arm    # linux aarch64
          - macos-15-intel      # macos x86_64
          - macos-latest        # macos arm64
          # tests are failing for now on windows.
          # - windows-latest

    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true

      - uses: astral-sh/setup-uv@v10

      # build options are configured in [tool.cibuildwheel] in pyproject.toml
      - name: Build wheels
        uses: pypa/cibuildwheel@v4.3.5

      - uses: actions/upload-artifact@v7
        with:
          name: pypi-wheel-${{ matrix.os }}
          path: ./wheelhouse/*.whl

  build_sdist:
    name: Build source distribution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true

      - uses: astral-sh/setup-uv@v10

      - name: Build sdist
        run: uv build --sdist

      - uses: actions/upload-artifact@v7
        with:
          name: pypi-src
          path: dist/*.tar.gz

  upload_pypi:
    needs: [build_wheels, build_sdist]
    runs-on: ubuntu-latest
    # upload to PyPI on every tag starting with 'v'
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    # alternatively, to publish when a GitHub Release is created, use the following rule:
    # if: github.event_name == 'release' && github.event.action == 'published'
    permissions:
      # short-lived token for trusted publishing
      id-token: write

    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: pypi-*
          path: dist
          merge-multiple: true

      - name: List all artifacts
        run: ls -R

      - uses: pypa/gh-action-pypi-publish@v1.14.3
        with:
          packages-dir: dist/
